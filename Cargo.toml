[package]
name = "wbox"
version = "1.0.0-rc2"
edition = "2021"
description = "Portable Windows 进程容器（AppContainer + Job Object，无需 VT-x / 管理员权限）"
license = "MIT OR Apache-2.0"

# 全 Rust 实现（PRD §2.2 依赖红线）：根包是 CLI 与宿主隔离后端，
# crates/wbox-linux 是 vendor/blink（C）的纯 Rust 重写，两者同一 workspace，
# 一条 `cargo build` 出齐 portable 分发的两个 exe。
[workspace]
members = [".", "crates/wbox-linux"]

[dependencies]
anyhow = "1"

# ---- OCI 镜像拉取（src/oci/）----
# 全部选用纯 Rust / 无 tokio 的小依赖，保证 windows-msvc 可编译。
#
# TLS 是**纯 Rust**：rustls 做协议，rustls-rustcrypto 做密码学原语。
# 之所以不用 rustls 的默认 provider——aws-lc-rs 和 ring 都带 C 与汇编源码，
# 违反"不引第三方 C/C++"这条约束（也正是当初选 native-tls 的原因：
# 那条路避开了 ring 的汇编，但代价是 Linux 上链接系统 OpenSSL，仍是 C 库）。
ureq = { version = "3", default-features = false, features = [
    "rustls-no-provider",   # 要 rustls，但不要它自带的 C/汇编 provider
    "rustls-webpki-roots",  # 内置根证书（纯 Rust 数据，不读系统证书库）
] }
rustls-rustcrypto = "0.0.2-alpha" # 纯 Rust 密码学 provider（成熟度见 docs/rust-rewrite.md）
tar = "0.4"          # tar 层解包
flate2 = { version = "1", default-features = false, features = ["rust_backend"] } # gzip 解压（miniz_oxide 纯 Rust）
sha2 = "0.10"        # blob digest 校验（sha256）
serde_json = "1"     # manifest / config JSON 解析（用 Value，不引入 serde derive）
base64 = "0.22"      # 认证 token 请求等编码辅助

# Linux 宿主的原生容器后端（LinuxNativeBackend，见 docs/architecture.md §3）：
# unshare / pivot_root / mount 这些没有 std 封装，必须走 libc FFI。
# libc 是零传递依赖的标准 FFI crate，与依赖红线（不加 tokio/clap/rustls）不冲突；
# 且用 target 限定，Windows 构建完全不引入。
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# windows-sys 只启用用到的 feature，保持编译快、二进制小。
[dependencies.windows-sys]
version = "0.59"
features = [
    # 基础类型：HANDLE、BOOL、PSID、CloseHandle 等
    "Win32_Foundation",
    # 令牌 / SID / 完整性级别 / SECURITY_CAPABILITIES / 命名管道安全属性
    "Win32_Security",
    # AppContainer profile API（CreateAppContainerProfile 等）位于 Isolation 命名空间
    "Win32_Security_Isolation",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    # 进程创建、attribute list、等待、退出码
    "Win32_System_Threading",
    # detached supervisor 启动前收紧标准句柄继承
    "Win32_System_Console",
    # Job Object API
    "Win32_System_JobObjects",
    # JOB_OBJECT_ASSIGN_PROCESS / QUERY / TERMINATE access masks
    "Win32_System_SystemServices",
    # GetCurrentProcessId 等内核辅助
    "Win32_System_Kernel",
    # GetComputerNameExW 用不到；保留最小集合
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Diagnostics_Debug",
    # Windows OCI volume 根句柄与 AppContainer 继承探针
    "Win32_Storage_FileSystem",
]

# wbox.exe 优先小体积（portable 单文件分发）。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 模拟器是热路径，按速度编译；wbox.exe 仍然按体积。
# 用 per-package 覆盖是因为 workspace 的 [profile] 只能定义在根。
[profile.release.package.wbox-linux]
opt-level = 3
codegen-units = 1
