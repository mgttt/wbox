[package]
name = "wbox"
version = "1.0.0-rc2"
edition = "2021"
description = "Portable Windows 进程容器（AppContainer + Job Object，无需 VT-x / 管理员权限）"
license = "MIT OR Apache-2.0"

# 全 Rust 实现（PRD §2.2.1 的两档口径）：
#   - 第一档「没有 C/C++」：crates/wbox-linux 取代了 vendor/blink；
#   - 第二档「承载产品语义的实现必须第一方」：codec / http / tls 三个 crate
#     取代了 serde_json、sha2、base64、flate2、tar、anyhow、ureq、rustls。
# 整棵构建图只剩七个 wbox 包、agenterm-platform，外加平台 ABI 声明。
# 一条 `cargo build` 出齐 portable 分发的两个 exe。
[workspace]
members = [".", "crates/wbox-codec", "crates/wbox-hpc-lab", "crates/wbox-http", "crates/wbox-linux", "crates/wbox-machine", "crates/wbox-tls"]

[workspace.dependencies]
# 单点冻结 Windows ABI 声明版本，各 package 仍只启用自身需要的 feature。
windows-sys = { version = "0.61", default-features = false }

[dependencies]
# 自实现的格式/摘要原语（PRD §2.2.1）：JSON、SHA-256、Base64、DEFLATE/gzip、tar。
# 这一条取代了原先的 serde_json / sha2 / base64 / flate2 / tar 五个第三方 crate。
wbox-codec = { path = "crates/wbox-codec" }

# ---- OCI 镜像拉取的 HTTP/TLS（src/oci/registry.rs）----
# 自实现的阻塞式 HTTP/1.1 客户端；TLS 1.3 在它依赖的 crates/wbox-tls 里，
# 同样是自实现。安全声明见 PRD §2.2.2 与 docs/rust-rewrite.md §5.1。
wbox-http = { path = "crates/wbox-http" }

# 纯 Rust Linux guest 引擎。同一份实现同时产出 wbox-linux.exe（EmuBackend 用）
# 与进程内入口（src/runtime），避免两份实现慢慢漂移。
wbox-linux = { path = "crates/wbox-linux" }

# ISA、宿主硬件、guest ABI 与执行 provider 的产品级契约。
# 宿主身份和无原生依赖的可执行文件约定由 agenterm-platform 提供；
# 其余机制按门禁逐项接入。
wbox-machine = { path = "crates/wbox-machine" }

# 只消费跨产品成立的宿主文件系统约定；状态目录与 guest 路由仍由 wbox 持有。
agenterm-platform = { git = "https://github.com/mgttt/agenterm.git", rev = "a24c6e9f43469f98a1591cdd7b0b23f63594426d", default-features = false, features = ["filesystem-conventions", "locking"] }

# Linux 宿主的原生容器后端（LinuxNativeBackend，见 docs/architecture.md §3）：
# unshare / pivot_root / mount 这些没有 std 封装，必须走 libc FFI。
# libc 是零传递依赖的标准 FFI crate，与依赖红线（不加 tokio/clap/rustls）不冲突；
# 且用 target 限定，Windows 构建完全不引入。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# windows-sys 只启用用到的 feature，保持编译快、二进制小。
[dependencies.windows-sys]
workspace = true
features = [
    # 基础类型：HANDLE、BOOL、PSID、CloseHandle 等
    "Win32_Foundation",
    # 令牌 / SID / 完整性级别 / SECURITY_CAPABILITIES / 命名管道安全属性
    "Win32_Security",
    # AppContainer profile API（CreateAppContainerProfile 等）位于 Isolation 命名空间
    "Win32_Security_Isolation",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    # 进程创建、attribute list、等待、退出码
    "Win32_System_Threading",
    # detached supervisor 启动前收紧标准句柄继承
    "Win32_System_Console",
    # Job Object API
    "Win32_System_JobObjects",
    # JOB_OBJECT_ASSIGN_PROCESS / QUERY / TERMINATE access masks
    "Win32_System_SystemServices",
    # GetCurrentProcessId 等内核辅助
    "Win32_System_Kernel",
    # GetComputerNameExW 用不到；保留最小集合
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Diagnostics_Debug",
    # Windows OCI volume 根句柄与 AppContainer 继承探针
    "Win32_Storage_FileSystem",
]

# wbox.exe 优先小体积（portable 单文件分发）。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 模拟器是热路径，按速度编译；wbox.exe 仍然按体积。
# 用 per-package 覆盖是因为 workspace 的 [profile] 只能定义在根。
[profile.release.package.wbox-linux]
opt-level = 3
codegen-units = 1

# 证书根门禁会对整包根证书执行第一方 RSA/ECDSA 验签；debug 大整数运算在
# Windows 上单测一项就超过数分钟。保留全量覆盖，仅优化密码学 crate 的测试。
[profile.test.package.wbox-tls]
opt-level = 2
