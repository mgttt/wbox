name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # 完整真机矩阵的 nightly 回归（PR 只跑核心组，见 build-wbox-linux 的条件步骤）
  schedule:
    - cron: "17 2 * * *" # 每日 02:17 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# 发布门禁说明（详见 docs/testing.md §发布门禁）：
#   tag v* 的 release job needs 全部九个门禁 job——
#   test-linux（Rust 单测）+ test-windows（同一套单测在 windows 上跑，
#   覆盖 cfg(windows) 模块）+ check-windows-msvc（Win32 编译门禁）+
#   smoke-windows（真机冒烟）+ build-wbox-linux（真机验收矩阵）+
#   guest-tests（guest 测试，前置缺失也按失败处理）+
#   test-windows-product（最终双 exe 的公开 CLI 产品路径）+
#   test-linux-backend（Linux 原生后端 rootless/cgroup 验收，见 §10）+
#   test-wine-backend（台阶③：Linux 上经 wine 跑 Windows 程序）——
#   任一 FAIL 即不创建 GitHub Release。Release 资产必附 SHA256SUMS.txt。

jobs:
  # ① Linux 单测：oci/config/backend 纯逻辑在 Linux 即可跑（当前测试主体）
  test-linux:
    timeout-minutes: 15  # 纯 Rust 单测，正常 <2 分钟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  # ①b Windows 真机单测：sandbox/acl/job/token 等 cfg(windows) 模块的测试
  #     只能在 windows runner 上跑（Linux 上整个 mod sandbox 不编译）。
  #     补这个 job 是因为 image_dir_layout_segments 这种 Windows-only bug
  #     长期被 Linux CI 掩盖（Path::components 在 Linux 无盘符前缀）。
  test-windows:
    timeout-minutes: 25  # windows runner 上编译较慢，正常 <8 分钟
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  # ② Windows 目标编译检查：Win32 专属代码（job/token/sandbox/acl/backend native）
  #    只能在 windows target 下编译，作为 Windows 代码的编译期门禁
  check-windows-msvc:
    timeout-minutes: 20  # 编译检查 + 双目标 clippy，正常 <5 分钟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --workspace：wbox-linux 也必须过 windows 目标的编译门禁
      # （它就是给 Windows 用的），否则新 crate 完全不在 CI 视野里。
      - run: cargo check --locked --workspace --target x86_64-pc-windows-msvc
      # docs/testing.md §二 与 DEVELOPMENT §3 把"0 warning"写成硬门槛，但此前
      # CI 只跑 cargo check——check **不因 warning 失败**，且完全没跑 clippy，
      # 于是该标准从未被真正强制过（实证：21730c1 引入的两条 clippy 告警
      # cloned_ref_to_slice_refs / err_expect 一路合进 main 无人拦下）。
      # 加 -D warnings 让门槛名副其实。
      #
      # 两个目标都要跑：cfg(windows) 模块（sandbox/token/job/acl）只在 windows
      # target 下参与编译，host 侧 clippy 根本看不到它们——上述两条告警正是
      # 出在 sandbox.rs，只有 windows target 的 clippy 能发现。
      - name: clippy —— host 目标（-D warnings）
        run: cargo clippy --all-targets --locked --workspace -- -D warnings
      - name: clippy —— windows-msvc 目标（-D warnings）
        run: cargo clippy --all-targets --locked --workspace --target x86_64-pc-windows-msvc -- -D warnings

  # ③ Windows 真机：build + 冒烟（GitHub windows runner 支持 AppContainer，无需管理员）
  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: 冒烟 —— --help / --version / image list
        shell: cmd
        run: |
          .\target\debug\wbox.exe --help
          .\target\debug\wbox.exe --version
          .\target\debug\wbox.exe image list
      - name: 冒烟 —— AppContainer 内跑 cmd.exe（隔离链路真机验证）
        shell: pwsh
        run: scripts/test-windows-native.ps1 -Wbox target/debug/wbox.exe
      - name: 网络行为门禁 —— 默认断网 / 显式放行
        shell: pwsh
        run: scripts/test-windows-network.ps1 -Wbox target/debug/wbox.exe
      # 镜像拉取真机验证：registry（docker.m.daocloud.io）不可达/被墙时
      # 记 ::warning:: 标黄，exit /b 0 不红；其余链路（HTTP/TLS/解包/ACL）
      # 一旦跑通即给出真机信号。严格失败场景由仓库内单测覆盖。
      - name: 真机验证 —— wbox image pull hello-world（registry 不可达允许 SKIP 标黄）
        shell: cmd
        run: |
          .\target\debug\wbox.exe image pull hello-world --registry docker.m.daocloud.io -V
          if errorlevel 1 (
            echo ::warning::wbox image pull hello-world 未通过（registry 不可达或网络限制）——记为 SKIP 不阻塞 CI
            exit /b 0
          )

  # ④ 构建 wbox-linux.exe（纯 Rust 模拟器，crates/wbox-linux）。
  #    这一步以前要 MSYS2 + MinGW-w64 编译 vendor/blink 的 C11+GNU 扩展源码；
  #    模拟器改成 Rust 之后，runner 自带的 cargo 就够了——**CI 里不再需要
  #    任何 C 工具链**，也不再有 MSVC 编不了 GNU 扩展这个约束。
  #    构建后在**真 Windows** 上跑完整验收矩阵（scripts/test-matrix.sh）。
  build-wbox-linux:
    runs-on: windows-latest
    # 上界：构建约 2 分钟，矩阵含网络用例与 guest 套件。没有上界时，
    # guest 侧一旦挂死会一直烧到 GitHub 默认的 6 小时才被杀。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 wbox-linux.exe
        run: cargo build --locked --release -p wbox-linux
      # 模拟器自己的门禁：指令语义 + syscall + 真 ELF 端到端。
      # 在 Windows 上跑这套很关键——它是 wbox-linux 的实际部署平台。
      - name: 模拟器单测与端到端用例
        run: cargo test --locked --release -p wbox-linux
      - name: 冒烟 —— wbox-linux.exe 能启动并报版本
        shell: cmd
        run: .\target\release\wbox-linux.exe --version
      # guest C 套件（矩阵 F 组）要把 t_*.c 交叉编译成 x86_64-linux-musl 静态
      # ELF，需要 zig；缺了它 F 组以 "no zig compiler found" 计 FAIL。
      # 装不上不致命——F 组会自行 SKIP，其余组照跑。
      # 注：本 job 的矩阵以 WBOX_GUEST_SKIP=1 跳过 F 组（guest C 套件由
      # 独立的 guest-tests job 负责），故这里不装 zig。
      # 矩阵需要 Linux x86_64 **静态** busybox（busybox-w32 是 Windows 原生版，
      # 不适用——这里要的是被模拟执行的 Linux ELF）。busybox.net 官方二进制：
      # （PR 核心组不跑矩阵，跳过下载省时间。）
      - name: 下载 Linux x86_64 静态 busybox（矩阵用）
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          curl -fsSL --retry 3 -o busybox \
            https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox
      # 真机验收矩阵：11 项基础 + 8 项 shell + fork 矩阵 + wget md5 +
      # epoll 单测（CI 无预编译静态二进制，脚本自动 SKIP 并提示）。
      # msys2 shell 下 OSTYPE=msys → native 模式直接执行 wbox-linux.exe。
      # 收窄策略（矩阵脚本无子集开关，不改动 scripts/）：
      #   PR                     → 只跑上面的 exe 冒烟（核心组），本步骤跳过；
      #   push main / tag / nightly / 手动 → 完整矩阵（门禁算入 release needs）。
      - name: 验收矩阵 —— scripts/test-matrix.sh（真 Windows native 模式，PR 跳过）
        if: github.event_name != 'pull_request'
        # F 组（guest C 套件）在 CI 里交给专职的 guest-tests job，这里整组 SKIP：
        # 一来避免两个 job 跑同一套用例，二来 F 组是按**单个用例文件**逐条计入
        # 矩阵成败的，已知失败（AF_UNIX/errno 精度，见 tests/known-failures.txt）
        # 会让矩阵永远红。本地跑 test-matrix.sh 时不设该变量，F 组照常执行。
        env:
          WBOX_GUEST_SKIP: 1
          # D 组要从 guest 内 wget 公网（mirrors.aliyun.com）。runner 到该站点
          # 的可达性不是被测对象，一次抖动就把发布门禁弄红——本仓既有惯例正是
          # 如此处理网络依赖（smoke-windows 的 image pull 步骤：registry 不可达
          # 记 ::warning:: 标黄不红）。此处对齐：失败记 SKIP 而非 FAIL。
          # guest 侧的 socket/epoll 语义并未失去覆盖——guest-tests job 的
          # t_net_epoll / t_net_sockopt 走本地 loopback，不依赖公网。
          WBOX_MATRIX_NET_SKIP: 1
          # 单项超时收到 20s（脚本默认 60s）。当前 W1（fork 挂死）会让 B/C 两组
          # 共 8 项各等满超时，按 60s 计要白等 8 分钟——而这正是排查 W1 的反馈环。
          # 实测通过项里最慢的是 D 组 wget 公网下载，约 0.6s，20s 有 30 倍余量，
          # 信号一点不丢。W1 修复后可视情况调回。
          WBOX_MATRIX_TIMEOUT: 20
        shell: bash
        run: |
          scripts/test-matrix.sh \
            target/release/wbox-linux.exe ./busybox 2>&1 | tee matrix.log
      - name: 上传验收矩阵日志
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: wbox-linux-test-matrix
          path: matrix.log
          retention-days: 30
      # always() 让 wbox-linux.exe 产物在 matrix 步骤失败时也上传，
      # 便于本地拉下来诊断（rc=127 之类的问题需要实机 exe 才能复现）。
      # 同时 guest-tests job 也声明要从本 artifact 取，但当前路径是
      # "build-wbox-linux 内部 build" 的产物，guest-tests 走自己 SKIP 分支。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wbox-linux.exe
          path: target/release/wbox-linux.exe
          retention-days: 30

  # ⑤ guest 测试：tests/ 目录下的 guest 级测试。
  #    契约：入口 tests/run.sh 与运行前置必须就绪，退出码即测试结果。
  #    本 job 是 required gate；artifact 或编译器缺失必须 FAIL，不能把零覆盖
  #    包装成成功。
  #
  #    运行前置有两项，缺一不可：
  #      ① wbox-linux.exe——本 job 不构建它（由 build-wbox-linux 产出）；
  #      ② zig cc（tests/guest/build.sh 要把 t_*.c 交叉编译成
  #         x86_64-linux-musl **静态 Linux ELF**，MinGW/MSVC 都做不到）。
  #    早期 tests/run.sh 尚未落地时本 job 走 SKIP 分支；入口落地后无条件执行，
  #    于是每次都以 "FATAL: wbox-linux.exe not found" 变红——这不是测试失败，
  #    是前置缺失，故此处显式判定并回到契约规定的 SKIP。
  guest-tests:
    runs-on: windows-latest
    # 上界：20 个用例，runner 内部每例 120s 超时，最坏约 40 分钟；
    # 留 50 分钟，超出即视为整体挂死。
    timeout-minutes: 50
    # 需要 build-wbox-linux 产出的 wbox-linux.exe（本 job 不重复构建）
    needs: build-wbox-linux
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      # guest 用例要交叉编译成 x86_64-linux-musl **静态 Linux ELF**
      # （tests/guest/build.sh），MinGW/MSVC 都做不到，必须有 zig。
      # 注意：MSYS2 仓库里**没有** mingw-w64-ucrt-x86_64-zig 这个包
      # （实测 `error: target not found`，且写在 setup-msys2 的 install:
      # 里是致命的，会把整个 job 判红）。改走 pip 装 ziglang——
      # tests/guest/build.sh 的探测链末位正是 `python3 -m ziglang cc`。
      # unzip：解开 zig 压缩包；diffutils：build.sh 拷贝校验用的 cmp
      # （精简安装里没有，实测会把整套 guest 用例误报成 copy verify mismatch）
      - name: 准备 MSYS2（unzip + diffutils）
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            unzip
            diffutils
      - name: 取 wbox-linux.exe（build-wbox-linux 的 artifact）
        uses: actions/download-artifact@v4
        with:
          name: wbox-linux.exe
          path: target/release
      # 退出码即测试结果。判定经 tests/known-failures.txt 基线：
      #   失败 ⊆ 基线 → 0；出现基线外新失败 → 1（回归）；
      #   基线内用例变通过 → 1（基线过期，强制同步收紧）。
      - name: guest C 回归套件（基线判定）
        run: |
          exe=target/release/wbox-linux.exe
          if [ ! -f "$exe" ]; then
            echo "::error::未取到 $exe —— required guest gate 无法执行"
            exit 1
          fi
          chmod +x "$exe" || true
          # zig：直接取官方 Windows 二进制，不走包管理器。
          #   - MSYS2 仓库没有 zig 包（error: target not found）；
          #   - MSYS2 python 受 PEP 668 保护且平台标签不被 PyPI 识别，
          #     `pip install ziglang` 会装到 **1.0 kB 的 0.0.0 占位包**上
          #     （日志显示 Successfully installed，实际 python3 -m ziglang
          #     并不存在）——是个会骗过"安装成功"判断的坑。
          # 下载失败时 required gate 必须失败；否则会再次出现全绿但零覆盖。
          ZVER=0.13.0
          ZDIR="$RUNNER_TEMP/zig-windows-x86_64-$ZVER"
          if ! command -v zig >/dev/null 2>&1 && [ ! -x "$ZDIR/zig.exe" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.zip" \
              "https://ziglang.org/download/$ZVER/zig-windows-x86_64-$ZVER.zip" &&
              unzip -q -o "$RUNNER_TEMP/zig.zip" -d "$RUNNER_TEMP" ||
              echo "::warning::zig 下载/解压失败"
          fi
          [ -x "$ZDIR/zig.exe" ] && export PATH="$ZDIR:$PATH"
          if ! command -v zig >/dev/null 2>&1; then
            echo "::error::未找到 zig —— required guest gate 无法编译用例"
            exit 1
          fi
          zig version
          WBOX_LINUX=$exe bash tests/run.sh

  prepare-ubuntu-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Ubuntu 24.04 runtime fixture
        run: bash scripts/build-ubuntu-fixture.sh target/ubuntu-fixture
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-24.04-amd64-fixture
          path: target/ubuntu-fixture
          if-no-files-found: error
          retention-days: 1

  # Product-path gate: exercise the public wbox CLI with the same two-file
  # bundle that release publishes. The fixture is assembled from the tracked
  # static Linux busybox, so registry and public-network failures cannot SKIP it.
  test-windows-product:
    runs-on: windows-latest
    timeout-minutes: 25
    needs: [build-wbox-linux, prepare-ubuntu-fixture]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - uses: actions/download-artifact@v4
        with:
          name: wbox-linux.exe
          path: target/product
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-24.04-amd64-fixture
          path: target/product/ubuntu-fixture
      - name: Windows product path (native + cached OCI Linux guest)
        shell: pwsh
        run: |
          scripts/test-windows-product.ps1 `
            -Wbox target/release/wbox.exe `
            -WboxLinux target/product/wbox-linux.exe `
            -Busybox busybox
      - name: Windows Ubuntu 24.04 product path (pinned OCI digest)
        shell: pwsh
        run: |
          scripts/test-windows-ubuntu.ps1 `
            -Wbox target/release/wbox.exe `
            -WboxLinux target/product/wbox-linux.exe `
            -UbuntuImage target/product/ubuntu-fixture

  # ⑦ Linux 原生后端（多宿主 §10）：rootless namespace + cgroup v2 限额。
  #    ubuntu runner 满足两个本地开发容器满足不了的前置——
  #    ① runner 以非 root 用户跑，故 RLIMIT_NPROC 兜底路径真实可测
  #       （root 会绕过 RLIMIT_NPROC，本地容器只能验"明确拒绝"分支）；
  #    ② ubuntu-latest 是 cgroup v2，故 memory.max/pids.max/cpu.max 这条
  #       首选路径在这里才有覆盖（本地容器是 cgroup v1）。
  #    宿主能力缺失时脚本记 SKIP 而非 FAIL（同 test-matrix.sh 的既有惯例）。
  test-linux-backend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      # L1 端到端与本脚本都要一个**静态** Linux ELF 当 guest（动态链接的
      # 宿主二进制在 pivot_root 后找不到 .so）。
      - name: 下载静态 busybox（guest 用）
        run: |
          curl -fsSL --retry 3 -o busybox \
            https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox
          chmod +x busybox
      # Ubuntu 24.04 起 AppArmor 默认禁掉 unprivileged user namespace，而这条
      # 门禁的全部用例都以它为前置。不打开的话脚本会老实 SKIP 全部用例并返回
      # 0 —— 门禁"全绿"但一个用例都没跑（实际发生过，见 run 30207284306）。
      # 趁 sysctl 还没打开，先在**真实的 Ubuntu 24.04 默认配置**下跑一次，
      # 确认报错文案能告诉用户"是 AppArmor 关了 userns"以及怎么开。这是该提示
      # 唯一的真机验证机会——开发容器既没有那个 sysctl，也不让改配额。
      # 不判定成败：这里本来就该失败，看的是失败得清不清楚。
      - name: 取证 —— userns 被封禁时的报错文案（不判定成败）
        continue-on-error: true
        run: |
          echo "apparmor_restrict_unprivileged_userns = $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo '(无此文件)')"
          target/debug/wbox run -- /bin/true 2>&1 | head -20 || true
      - name: 打开 unprivileged user namespace（rootless 隔离的硬前置）
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # 环境事实留档：出问题时先看这段，能立刻分辨"代码回归"与"runner 能力变化"
      - name: 记录宿主能力（不判定成败）
        run: |
          echo "uid=$(id -u) cgroup=$(stat -fc %T /sys/fs/cgroup)"
          cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || echo "(无 cgroup v2 控制器)"
          # 注意：cgroup.controllers 存在 ≠ 能用。委派没开时自己的 cgroup 目录
          # 里建不了子目录，wbox 会退化到 rlimit 兜底。这里实测一下写权限。
          self=$(sed -n 's/^0:://p' /proc/self/cgroup)
          echo "自身 cgroup: ${self:-（无 0:: 行，非 v2）}"
          if mkdir "/sys/fs/cgroup${self}/wbox-ci-probe" 2>/dev/null; then
            echo "cgroup v2 委派: 可写（能建子目录）"
            rmdir "/sys/fs/cgroup${self}/wbox-ci-probe"
          else
            echo "cgroup v2 委派: **不可写** → 走 rlimit 兜底路径"
          fi
          unshare -Ur --mount true && echo "userns: ok" || echo "userns: 不可用"
      # WBOX_LBE_REQUIRE=1：能力缺失记 FAIL 而非 SKIP。这台 runner 是专门为
      # 这条门禁选的，"跑不了"本身就是要修的问题，不能静默放过。
      - name: 端到端 —— LinuxNativeBackend L1/L2 + 宿主程序模式 + 网络默认 验收
        env:
          WBOX_LBE_REQUIRE: '1'
        run: scripts/test-linux-backend.sh target/debug/wbox ./busybox
      # 门禁：把 cgroup v2 首选路径也纳入回归保护。
      # runner 自身没有可委派的 cgroup，所以这里用 sudo 现造一个：根 cgroup
      # 不受 no-internal-process 约束，可直接下发控制器；委派根本身不放进程，
      # 我们把跑脚本的那个子 shell 放进 leaf，wbox 就会在一个可写 cgroup 里
      # 启动，从而真正走到首选路径。
      #
      # 为什么必须做成门禁而不是"取证一次就算数"：这条路径此前在任何环境都
      # 没执行过，代码里因此藏着一个成功路径的目录泄漏，谁都没发现。
      # 只有持续跑，才谈得上有覆盖。
      - name: cgroup v2 首选路径门禁（现造委派子树）
        env:
          WBOX_LBE_REQUIRE: '1'
          WBOX_LBE_CGROUP: '1'
        run: |
          BASE=/sys/fs/cgroup/wbox-gate
          sudo mkdir -p "$BASE/leaf"
          sudo sh -c 'echo "+memory +pids +cpu" > /sys/fs/cgroup/cgroup.subtree_control'
          sudo chown -R "$(id -u):$(id -g)" "$BASE"
          # 委派根下发控制器给 leaf（此刻它自己没有进程，允许）
          echo "+memory +pids +cpu" > "$BASE/cgroup.subtree_control"
          echo "leaf 内可见：$(ls "$BASE/leaf" | tr '\n' ' ')"
          # 只把**子 shell**放进 leaf，不动本 step 的 shell（免得影响 runner 收尾）
          bash -c 'mypid=$$
                   sudo sh -c "echo $mypid > '"$BASE"'/leaf/cgroup.procs"
                   echo "脚本所在 cgroup: $(sed -n "s/^0:://p" /proc/self/cgroup)"
                   exec scripts/test-linux-backend.sh target/debug/wbox ./busybox'
      # 取证步骤（不判定成败）：并排比较两种层级布局，出问题时用来分辨
      # "环境变了"还是"代码回归了"。门禁那步只回答"能不能走首选路径"。
      - name: 取证 —— cgroup v2 委派下的层级布局（不判定成败）
        continue-on-error: true
        run: scripts/probe-cgroup2.sh target/debug/wbox

  # ⑧ 台阶③（Linux 上跑 Windows 程序）：单独成 job 而不是并进
  #    test-linux-backend——wine64 + mingw 装下来体量不小，塞进主门禁会拖慢
  #    每次 push；单独 job 并行跑，不占用主链路时间。
  test-wine-backend:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: 装 wine64 与 mingw（PE 夹具现场编译）
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            wine64 gcc-mingw-w64-x86-64
      - name: 打开 unprivileged user namespace（隔离硬前置）
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: 下载静态 busybox（镜像模式用例需要）
        run: |
          curl -fsSL --retry 3 -o busybox \
            https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox
          chmod +x busybox
      - name: 记录 wine 能力（不判定成败）
        run: |
          command -v wine64 wine || ls -l /usr/lib/wine/ || true
          (wine64 --version || /usr/lib/wine/wine64 --version) 2>&1 | head -2 || true
      # 整套跑（W 段是重点；其余段落顺带再验一遍，成本很低）。
      # 两个 REQUIRE 都要设，各管一件事：
      #   WBOX_LBE_REQUIRE=1  —— userns 等 wbox 自身硬前置缺失记 FAIL
      #   WBOX_WINE_REQUIRE=1 —— wine/mingw 缺失记 FAIL
      # 不设第二个的话，上面的 apt 装包一旦失败（或包名随发行版改了），
      # W 段会整段 SKIP 而这个 job 照样变绿——一个"什么都没测"的 required
      # job，还是 release 的前置。脚本另有一条兜底：W 段没产出任何断言也红。
      - name: 端到端 —— 含 W 段（台阶③ wine 执行器）
        env:
          WBOX_LBE_REQUIRE: '1'
          WBOX_WINE_REQUIRE: '1'
        run: scripts/test-linux-backend.sh target/debug/wbox ./busybox

  # ⑦ tag 发布门禁：needs 全部六个门禁 job 全绿才创建 Release；
  #    打包 portable 双 exe（wbox.exe + wbox-linux.exe）+ SHA256SUMS.txt
  release:
    timeout-minutes: 30  # 构建 release + 打包 + 上传
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, test-windows, check-windows-msvc, smoke-windows, build-wbox-linux, guest-tests, test-windows-product, test-linux-backend, test-wine-backend]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: 下载 wbox-linux.exe 产物（与 wbox.exe 同目录，portable 分发形态）
        uses: actions/download-artifact@v4
        with:
          name: wbox-linux.exe
          path: target/release
      - name: 打包 wbox-portable-windows-x64.zip（wbox.exe + wbox-linux.exe）
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\wbox.exe, target\release\wbox-linux.exe `
            -DestinationPath wbox-portable-windows-x64.zip
      - name: 生成 SHA256SUMS.txt（两个 exe + zip）
        shell: pwsh
        run: |
          $files = @('target\release\wbox.exe', 'target\release\wbox-linux.exe',
                     'wbox-portable-windows-x64.zip')
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLower()
            "{0}  {1}" -f $h, (Split-Path -Leaf $f)
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
      - name: 上传 Release 资产
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/wbox.exe
            target/release/wbox-linux.exe
            wbox-portable-windows-x64.zip
            SHA256SUMS.txt
