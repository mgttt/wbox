[package]
name = "wbox-http"
version = "1.0.0-rc2"
edition = "2021"
description = "wbox 自实现的阻塞式 HTTP/1.1 客户端（TLS 走同仓 wbox-tls）"
license = "MIT OR Apache-2.0"

# 零第三方依赖。协议层（URL、请求/响应、分块编码、重定向、代理）与 TLS
# 全部第一方实现——TLS 在 crates/wbox-tls。
[dependencies]
wbox-codec = { path = "../wbox-codec" }
wbox-tls = { path = "../wbox-tls" }
