[package]
name = "wbox-tls"
version = "1.0.0-rc2"
edition = "2021"
description = "wbox 自实现的 TLS 1.3 客户端（纯 Rust，零第三方依赖）"
license = "MIT OR Apache-2.0"

# 零第三方依赖——这是本 crate 存在的全部理由。密码学原语（SHA-2、AES-GCM、
# X25519、RSA、ECDSA）、X.509 链校验、TLS 1.3 握手全部第一方实现。
#
# 只依赖同仓的 wbox-codec（复用它的 SHA-256 与 base64），以及第一方
# agenterm-platform 的宿主 CSPRNG 契约；密码学和 TLS 策略仍全部在本 crate。
[dependencies]
wbox-codec = { path = "../wbox-codec" }
agenterm-platform = { workspace = true, features = ["entropy"] }
