[package]
name = "wbox-linux"
version = "1.0.0-rc2"
edition = "2021"
description = "x86-64 Linux 用户态模拟器（纯 Rust，替代 vendor/blink）"
license = "MIT OR Apache-2.0"

# 零第三方实现依赖。宿主 CSPRNG 复用第一方 agenterm-platform；其余宿主 syscall
# 一律经 std，需要 std 未暴露的 Windows 原语时只使用 windows-sys ABI 声明。
[dependencies]
agenterm-platform = { workspace = true, features = ["entropy"] }

# Windows 文件属性查询使用 windows-sys；CSPRNG 已统一由 agenterm-platform 接线。
[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
]

[[bin]]
name = "wbox-linux"
path = "src/main.rs"

[lib]
name = "wbox_linux"
path = "src/lib.rs"
