[package]
name = "wbox-linux"
version = "1.0.0-rc2"
edition = "2021"
description = "x86-64 Linux 用户态模拟器（纯 Rust，替代 vendor/blink）"
license = "MIT OR Apache-2.0"

# 零第三方实现依赖。宿主 CSPRNG 与文件对象身份复用第一方 agenterm-platform；
# guest syscall、权限策略和 Linux ABI 仍由本 crate 实现。
[dependencies]
agenterm-platform = { workspace = true, features = ["entropy", "file-identity"] }

[[bin]]
name = "wbox-linux"
path = "src/main.rs"

[lib]
name = "wbox_linux"
path = "src/lib.rs"
